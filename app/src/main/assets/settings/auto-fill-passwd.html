<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><script src="../js/xtest-data.js"></script><script src="../js/xapp.js"></script><script src="../js/H5lock.js"></script><script src="../js/utils.js"></script><script src="../js/unlock-gesture.js"></script><script src="js/auto-fill-passwd.js"></script><title>Auto Fill Password</title><style></style></head><body><div class="container"><header><div class="nav-bar"><h1 data-string-id="short_text_pass_manager">密码管理</h1><button class="dropdown-menu" data-string-id="web_str_btn_manager" onclick='_XAPP_.dispatchEvent("event_page_to_app",{transId:"show_auto_fill_menu"})'>管理</button></div></header><main class="content gray-bg"><ul id="auto-fill-passwd-list" class="list-view"></ul></main></div><div id="edit-auto-fill-pwd-panel" class="popup-panel"><div class="popup-header"><span class="popup-back"></span><h1 data-string-id="web_str_title_edit_auto_fill">编辑自动填充密码</h1></div><div id="edit-auto-fill-pwd" class="pop-content gray-bg"><div class="section"><div class="input-group"><div class="input-item"><label data-string-id="web_str_input_user" class="input-label">用户名</label> <input data-placeholder-string-id="web_str_input_user" type="text" class="input-field" placeholder="请输入用户名"></div><div class="input-item"><label data-string-id="web_str_input_pwd" class="input-label">密码</label> <input data-placeholder-string-id="web_str_input_pwd" type="password" class="input-field" placeholder="请输入密码"></div><div class="input-item"><label data-string-id="web_str_input_remark" class="input-label">备注</label> <input data-placeholder-string-id="web_str_input_remark" type="text" class="input-field" placeholder="请输入备注"></div><div class="button-group"><button data-string-id="btn_text_del" class="btn-danger">删除</button> <button data-string-id="web_str_save" class="btn-primary">保存</button></div></div></div></div></div><div id="new-auto-fill-pwd-panel" class="popup-panel"><div class="popup-header"><span class="popup-back"></span><h1 data-string-id="web_str_title_add_auto_fill">新增自动填充密码</h1></div><div id="new-auto-fill-pwd" class="pop-content gray-bg"><div class="section"><div class="input-group"><div class="input-item"><label data-string-id="web_str_input_host" class="input-label">域名</label> <input id="host" type="text" class="input-field" placeholder="Host: e.g. www.examole.com"></div><div class="input-item"><label data-string-id="web_str_input_user" class="input-label">用户名</label> <input data-placeholder-string-id="web_str_input_user" id="login_name" type="text" class="input-field" placeholder="请输入用户名"></div><div class="input-item"><label data-string-id="web_str_input_pwd" class="input-label">密码</label> <input data-placeholder-string-id="web_str_input_pwd" id="password" type="text" class="input-field" placeholder="请输入密码"></div><div class="input-item"><label data-string-id="web_str_input_remark" class="input-label">备注</label> <input data-placeholder-string-id="web_str_input_remark" id="remark" type="text" class="input-field" placeholder="请输入备注"></div><div class="button-group"><button id="btn-submit" data-string-id="web_str_save" class="btn-primary">保存</button></div></div></div></div></div></body></html>
