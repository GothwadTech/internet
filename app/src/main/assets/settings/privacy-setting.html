<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><link rel="stylesheet" href="css/privacy-setting.css"><script src="../js/xapp.js"></script><script src="../js/H5lock.js"></script><script src="../js/utils.js"></script><script src="../js/unlock-gesture.js"></script><script src="js/privacy-setting.js"></script><title>Security And Privacy</title></head><body><div class="container"><header><h1 data-string-id="web_str_set_security_and_privacy">安全及隐私</h1></header><main class="content"><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_do_not_show_search_his">不显示搜索历史</span></div><label class="switch"><input type="checkbox" id="do-not-show-search-his" aria-label="不显示搜索历史"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="do_not_get_sugession_from_his">不要从历史记录中获取搜索建议</span></div><label class="switch"><input type="checkbox" id="do-not-show-browser-his" aria-label="不要从历史记录中获取搜索建议"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="do_not_get_sugession_from_bookmark">不要从用户书签获取网址建议</span></div><label class="switch"><input type="checkbox" id="do-not-show-browser-bookmarks" aria-label="不要从用户书签获取网址建议"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_do_not_show_clipboard_content">网址建议不显示剪贴板内容</span></div><label class="switch"><input type="checkbox" id="do-not-show-clipboard-content" aria-label="网址建议不显示剪贴板内容"> <span class="slider"></span></label></div><div class="divider"></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_support_cookies_in_priv">隐私模式不禁用Cookies</span></div><label class="switch"><input type="checkbox" id="support-cookies-in-priv" aria-label="隐私模式不禁用Cookies"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_disable_third_cookies">禁用第三方Cookies</span></div><label class="switch"><input type="checkbox" id="disable-third-cookies" aria-label="禁用第三方Cookies"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_enable_dnt">开启DNT</span><div class="setting-description" data-string-id="web_str_enable_dnt_desc">告诉网站不要跟踪我</div></div><label class="switch"><input type="checkbox" id="enable-dnt" aria-label="告诉网站不要跟踪我"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_dont_upload_ux_data">不要收集用户体验数据</span><div class="setting-description" data-string-id="web_str_dont_upload_ux_data_desc">收集用户体验数据有助于帮助我们改善产品体验</div></div><label class="switch"><input type="checkbox" id="dont-upload-user-exp-data" aria-label="不要收集用户体验数据"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_dont_show_ssl_warning">忽略https连接安全警告</span><div class="setting-description" data-string-id="web_str_dont_show_ssl_warning_desc">忽略https连接安全警告，允许浏览存在安全风险的站点</div></div><label class="switch"><input type="checkbox" id="ignore_security_warnings" aria-label="忽略https连接安全警告"> <span class="slider"></span></label></div><div class="divider"></div><a id="set-unlock-gesture" href="#" class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_set_unlock_gesture">设定解锁手势</span><div class="setting-description" data-string-id="web_str_set_unlock_gesture_desc">一些私密内容通过解锁才能查看</div></div><span class="arrow-right">›</span></a><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_unlock_to_view_his">查看历史记录需要解锁</span></div><label class="switch"><input type="checkbox" id="unlock-to-view-his" aria-label="查看历史记录需要解锁"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_disallow_call_app">禁止页面启动外部应用</span></div><label class="switch"><input type="checkbox" id="enable_call_app" aria-label="禁止页面启动外部应用"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_disable_write_to_clipboard">禁止页面写入剪贴板</span></div><label class="switch"><input type="checkbox" id="disable-write-clipboard" aria-label="禁止页面写入剪贴板"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_adv_set_allow_access_location">允许网页获取手位置信息</span></div><label class="switch"><input type="checkbox" id="enable_geolocation" aria-label="允许网页获取手机位置信息"> <span class="slider"></span></label></div><div class="divider"></div><a href="javascript:_XAPP_.dispatchEvent('event_page_to_app',{'transId':'clean_user_privacy_data'});" class="setting-item"><span class="setting-label" data-string-id="web_str_clean_data">清理用户隐私数据</span> <span class="arrow-right">›</span></a><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_exit_clean_web_cache">退出时自动清理隐私数据</span><div class="setting-description" data-string-id="web_str_desc_exit_clean_web_cache">历史、Cookies、搜索记录、页面缓存、表单数据等</div></div><label class="switch"><input type="checkbox" id="clean-web-cache-on-exit" aria-label="退出时自动清理隐私数据"> <span class="slider"></span></label></div></main></div></body></html>
