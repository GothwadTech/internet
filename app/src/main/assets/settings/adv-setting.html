<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><script src="../js/xtest-data.js"></script><script src="../js/xapp.js"></script><script src="js/adv-setting.js"></script><title>Advanced Setting</title><style>.list-item-column{background-color:#fff;border-radius:8px;padding:15px;margin-top:10px;border-bottom:5px solid #f5f5f5;display:flex;flex-direction:column}.item-header{font-size:18px;font-weight:700;margin-bottom:10px}.item-description{color:#666;margin-bottom:15px}.form-group{margin-bottom:20px}.form-control{width:100%;padding:8px 12px;font-size:16px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box}textarea.form-control{min-height:200px;resize:vertical}.form-control:focus{outline:0;border-color:#999}</style></head><body><div class="container"><header><h1 data-string-id="web_str_title_adv_setting">高级设置</h1></header><main class="content"><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_allow_open_link_in_new_win">允许页面弹窗</span><div class="setting-description" data-string-id="web_str_setting_allow_open_link_in_new_win_desc"></div></div><label class="switch"><input type="checkbox" id="support-multi-win" aria-label="允许页面弹窗"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_disable_cookies">禁用cookies</span></div><label class="switch"><input type="checkbox" id="accept_cookies" aria-label="禁用cookies"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_disable_js">禁用js</span></div><label class="switch"><input type="checkbox" id="disable-javascript" aria-label="禁用js"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_force_user_scalable">强制页面缩放</span><div class="setting-description" data-string-id="web_str_force_user_scalable_desc">移动页面强制页面支持双指缩放</div></div><label class="switch"><input type="checkbox" id="force-user-scalable" aria-label="强制页面缩放"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_wrap_line_when_scaled">自动折行</span><div class="setting-description" data-string-id="web_str_wrap_line_when_scaled_desc">页面进行缩放的时候自动折行</div></div><label class="switch"><input type="checkbox" id="auto-wrap-when-scaled" aria-label="自动折行"> <span class="slider"></span></label></div><div class="divider"></div><a href="custom-user-agent.html" class="setting-item"><span class="setting-label" data-string-id="web_str_add_custom_ua">添加自定义UA</span> <span class="arrow-right">›</span> </a><a href="custom-search-engine.html" class="setting-item"><span class="setting-label" data-string-id="web_str_add_custom_search">添加自定义搜索引擎</span> <span class="arrow-right">›</span></a><div class="divider"></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_disable_read_mode">禁用阅读模式</span></div><label class="switch"><input type="checkbox" id="disable-read-mode" aria-label="禁用阅读模式"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_support_super_cache">支持超级缓存</span><div class="setting-description" data-string-id="web_str_setting_support_super_cache_desc">前进后退的时候不重新加载页面</div></div><label class="switch"><input type="checkbox" id="support-super-cache" aria-label="支持超级缓存"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_auto_clean_cache">自动清理页面缓存</span><div class="setting-description" data-string-id="web_str_auto_clean_cache_desc">定期自动清理页面缓存，减少空间占用，提升运行速度</div></div><label class="switch"><input type="checkbox" id="auto-clean-web-cache" aria-label="自动清理缓存"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_enable_chrome_remote_debug">开启Chrome远程调试</span><div class="setting-description" data-string-id="web_str_enable_chrome_remote_debug_desc">开启后，可以在浏览器中调试页面，方便调试</div></div><label class="switch"><input type="checkbox" id="enable-remote-debug" aria-label="开启Chrome远程调试"> <span class="slider"></span></label></div></main></div></body></html>
