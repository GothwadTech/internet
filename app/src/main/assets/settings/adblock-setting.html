<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><script src="../js/xtest-data.js"></script><script src="../js/xapp.js"></script><script src="js/adblock-setting.js"></script><title>Adblock Setting</title><style></style></head><body><div class="container"><header><h1 data-string-id="web_str_setting_adb">广告拦截</h1></header><main class="content"><div class="stats"><div class="stat-item"><div class="stat-label"><span data-string-id="web_str_adb_total_rules">规则条数</span></div><span id="number-of-rules" class="stat-value">23</span></div><div class="stat-item"><div class="stat-label"><span data-string-id="web_str_adb_total_blocked">已经拦截</span></div><span id="number-of-blocked" class="stat-value">5</span></div></div><div class="divider"></div><a href="adblock-log.html" class="setting-item"><span class="setting-label" data-string-id="web_str_adb_log">拦截日志</span> <span class="arrow-right">›</span> </a><a href="ad-rule-file.html" class="setting-item"><span class="setting-label" data-string-id="web_str_rule_files">规则文件</span> <span class="arrow-right">›</span></a><div data-transaction-id="change_auto_update_cycle" data-option-group-name="rule_file_update_cycle" class="setting-item"><span class="setting-label" data-string-id="web_str_setting_auto_update_rule">自动更新规则</span> <span class="sub-label">不自动更新</span> <span class="arrow-right">›</span></div><a href="custom-ad-rules.html" class="setting-item"><span class="setting-label" data-string-id="web_str_custom_rule">自定义规则</span> <span class="arrow-right">›</span> </a><a href="domain-manager.html?type=1" class="setting-item"><span class="setting-label" data-string-id="web_str_adb_white_list">白名单</span> <span class="arrow-right">›</span></a><div class="divider"></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_adb_support_adblock">开启广告拦截</span></div><label class="switch"><input type="checkbox" id="active-ad-block" aria-label="开启广告拦截"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_show_ad_block_toast">显示拦截提示消息</span></div><label class="switch"><input type="checkbox" id="show-ad-block-toast" aria-label="显示拦截提示消息"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_adb_enable_smart_adb">启用强力拦截</span><div class="setting-description" data-string-id="web_str_adb_enable_smart_adb_desc">通过一些智能策略拦截站点之外第三方的资源</div></div><label class="switch"><input type="checkbox" id="enable-smart-adb" aria-label="启用强力拦截"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_adb_block_pop_window">拦截页面弹窗</span><div class="setting-description" data-string-id="web_str_adb_block_pop_window_desc">阻止页面主动弹窗和点击广告链接后的弹出窗口</div></div><label class="switch"><input type="checkbox" id="block-pop-window" aria-label="拦截页面弹窗"> <span class="slider"></span></label></div></main></div></body></html>
