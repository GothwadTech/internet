<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><link rel="stylesheet" href="css/user-center.css"><script src="../js/xtest-data.js"></script><script src="../js/xapp.js"></script><script src="js/user-center.js"></script><title>User Center</title><style></style></head><body><div class="container"><main class="content"><div id="profile" class="profile-section"><div id="avatar" class="avatar"></div><div id="user-name" class="user-name">点击登陆/注册</div><div id="user-id" class="user-id">点击登陆/注册</div></div><div class="divider"></div><h2 data-string-id="title_user_data" class="section-title">用户数据</h2><div data-transaction-id="backup_user_data" class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_backup_user_data">备份用户数据</span><div class="setting-description" data-string-id="web_str_backup_user_data_desc">备份用户数据并生成一个还原文件</div></div><span class="arrow-right">›</span></div><div data-transaction-id="recover_user_data" class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_restore_user_data">恢复用户数据</span><div class="setting-description" data-string-id="web_str_restore_user_data_desc">从指定的还原文件恢复用户数据</div></div><span class="arrow-right">›</span></div><div data-transaction-id="auto_backup_user_data" class="setting-item" data-option-group-name="auto_backup_cycle"><div class="setting-content"><span class="setting-label" data-string-id="str_auto_backup_user_data">自动备份用户数据</span><div class="setting-description" data-string-id="str_auto_backup_user_data_desc">自动备份用户数据到公共下载目录</div></div><span class="sub-label">不自动备份</span> <span class="arrow-right">›</span></div><div data-transaction-id="import_bookmark" class="setting-item"><span class="setting-label" data-string-id="web_str_import_bm">从HTML导入书签</span> <span class="arrow-right">›</span></div><div data-transaction-id="export_bookmark" class="setting-item"><span class="setting-label" data-string-id="web_str_export_bm">导出书签至HTML文件</span> <span class="arrow-right">›</span></div><div class="divider"></div><h2 data-string-id="title_data_sync" class="section-title">数据同步</h2><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_auto_sync">自动和云端数据同步</span><div class="setting-description" data-string-id="web_str_auto_sync_desc">自动上传发生改变的数据到云端</div></div><label class="switch"><input type="checkbox" id="auto-sync-to-cloud" aria-label="自动和云端数据同步"> <span class="slider"></span></label></div><div data-transaction-id="select_sync_item" class="setting-item" data-option-group-name="sync_items"><span class="setting-label" data-string-id="web_str_select_sync_item">设置同步项目</span> <span class="sub-label">共5项</span> <span class="arrow-right">›</span></div><div class="center-buttons"><button data-transaction-id="push_user_data" data-string-id="web_str_push_user_data" id="sync-to-server" class="btn-primary">同步到云端</button> <button data-transaction-id="pull_user_data" data-string-id="web_str_pull_user_data" id="sync-from-server" class="btn-primary">从云端同步</button></div></main></div></body></html>
