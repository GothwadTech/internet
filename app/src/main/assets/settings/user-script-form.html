<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><script src="../js/xtest-data.js"></script><script src="../js/utils.js"></script><script src="../js/xapp.js"></script><script src="js/user-script-form.js"></script><title>User Scripts</title></head><style></style><body><div class="container"><header><div class="nav-bar"><button class="left" data-string-id="btn_text_help" id="new-custom-search">帮助</button><h1 data-string-id="web_str_title_user_script_form">添加/编辑脚本</h1><button data-string-id="web_str_save" id="save-user-script">保存</button></div></header><main class="content gray-bg"><div style="background-color:#fff;margin-top:3px"><div class="input-item"><label data-string-id="web_str_script_name" class="input-label">名称</label> <input id="field-name" type="text" data-placeholder-string-id="web_str_script_name" class="input-field" placeholder="脚本名称"></div><div class="input-item"><label data-string-id="web_str_script_desc" class="input-label">简介</label> <input id="field-description" type="text" data-placeholder-string-id="web_str_script_desc" class="input-field" placeholder="脚本简介"></div><div class="input-item"><label data-string-id="web_str_script_create_by" class="input-label">作者</label> <input id="field-author" type="text" data-placeholder-string-id="web_str_script_create_by" class="input-field" placeholder="脚本作者"></div><div id="field-execute-mode" data-transaction-id="change_script_execute_mode" data-option-group-name="script_execute_mode" class="setting-item" style="border-bottom:1px solid #f5f5f5"><span class="setting-label" data-string-id="web_str_set_ex_point">设置脚本执行方式</span> <span class="sub-label">自动执行</span> <span class="arrow-right">›</span></div><input id="field-extra" type="hidden"><div class="input-item"><textarea id="field-script" data-placeholder-string-id="web_str_script_code" class="input-field" placeholder="js代码或油猴脚本" rows="4"></textarea></div></div></main></div></body></html>
