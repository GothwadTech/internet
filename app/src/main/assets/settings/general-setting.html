<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"><link rel="stylesheet" href="../css/xapp.css"><script src="../js/xtest-data.js"></script><script src="../js/xapp.js"></script><title>General Setting</title><style></style></head><body><div class="container"><header><h1 data-string-id="web_str_set_general">基本设置</h1></header><main class="content"><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_keep_screen_on">保持屏幕常亮</span></div><label class="switch"><input type="checkbox" id="keep-screen-on" aria-label="保持屏幕常亮"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_flow_system_dark_mode">跟随系统黑暗模式设定</span></div><label class="switch"><input type="checkbox" id="follow-sys-dark-mode" aria-label="跟随系统黑暗模式设定"> <span class="slider"></span></label></div><div class="divider"></div><div data-transaction-id="change_search_engine" class="setting-item" data-option-group-name="search_engine"><span class="setting-label" data-string-id="web_str_setting_switch_search">切换搜索引擎</span> <span class="sub-label">百度</span> <span class="arrow-right">›</span></div><div class="setting-item"><div class="setting-content"><span data-string-id="web_str_setting_disable_search_sug" class="setting-label">禁用搜索建议</span></div><label class="switch"><input type="checkbox" id="disable-search-suggestion" aria-label="禁用搜索建议"> <span class="slider"></span></label></div><div data-transaction-id="change_downloader" class="setting-item" data-option-group-name="downloader"><span class="setting-label" data-string-id="web_str_current_downloader">当前下载器</span> <span class="sub-label">浏览器默认下载器</span> <span class="arrow-right">›</span></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_remind_when_down_complete">下载完成提醒我</span></div><label class="switch"><input type="checkbox" id="remind-when-down-complete" aria-label="下载完成提醒我"> <span class="slider"></span></label></div><div class="divider"></div><div data-transaction-id="change_tab_revert_way" class="setting-item" data-option-group-name="tab_revert_way"><span class="setting-label" data-string-id="web_str_setting_open_last_tab">启动恢复上次未关闭标签</span> <span class="sub-label">开启</span> <span class="arrow-right">›</span></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_force_open_bg">强制在后台打开链接</span></div><label class="switch"><input type="checkbox" id="force-open-in-bg" aria-label="强制在后台打开链接"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_force_open_in_new_tab">强制在新标签中打开链接</span></div><label class="switch"><input type="checkbox" id="force-open-in-new-tab" aria-label="强制在新标签中打开链接"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_show_search_res_on_new_tab">在新标签中打开搜索结果</span></div><label class="switch"><input type="checkbox" id="open-search-in-new-tab" aria-label="在新标签中打开搜索结果"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_confirm_when_close_tabs">关闭所有标签时进行确认</span></div><label class="switch"><input type="checkbox" id="confirm-when-close-tabs" aria-label="关闭所有标签时进行确认"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_close_tab_in_order">返回标签按照打开的顺序</span><div class="setting-description" data-string-id="web_str_close_tab_in_order_desc">关闭标签是返回其父标签还是按照打开标签的顺序依次返回</div></div><label class="switch"><input type="checkbox" id="close-tab-in-order" aria-label="返回标签按照打开的顺序"> <span class="slider"></span></label></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_new_tab_at_bottom">新建标签放置在标签列表底部</span><div class="setting-description" data-string-id="web_str_new_tab_at_bottom_desc">默认情况下新建标签放置在当前标签下面</div></div><label class="switch"><input type="checkbox" id="new-tab-at-bottom" aria-label="新建标签放置在标签列表底部"> <span class="slider"></span></label></div><div class="divider"></div><div data-transaction-id="change_language" class="setting-item" data-option-group-name="language"><span class="setting-label" data-string-id="web_str_change_language">设置语言</span> <span class="sub-label">自动</span> <span class="arrow-right">›</span></div><div class="setting-item"><div class="setting-content"><span class="setting-label" data-string-id="web_str_setting_show_confirm_on_exit">退出浏览器显示确认对话框</span></div><label class="switch"><input type="checkbox" id="show-confirm-dlg-on-exit" aria-label="退出浏览器显示确认对话框"> <span class="slider"></span></label></div><div data-transaction-id="set_as_default_browser" class="setting-item"><span class="setting-label" data-string-id="web_str_set_as_default_browser">设置为默认浏览器</span> <span class="arrow-right">›</span></div></main></div></body></html>
